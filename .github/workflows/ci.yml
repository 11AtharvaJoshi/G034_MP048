
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "dvc==3.67.1" "dvc-gdrive==3.0.1"
          pip install "cryptography==43.0.3" "pyOpenSSL==24.2.1"
      - name: Verify Google Drive dependencies
        run: |
          python -c "import cryptography, OpenSSL; print('cryptography:', cryptography.__version__); print('pyOpenSSL:', OpenSSL.__version__)"
      - name: Authenticate and pull DVC datasets
        env:
          GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
        run: |
          set -euo pipefail

          credentials_file="$RUNNER_TEMP/gdrive-service-account.json"
          trap 'rm -f "$credentials_file"' EXIT

          printf '%s' "$GDRIVE_CREDENTIALS_DATA" > "$credentials_file"

          dvc remote modify --local gdrive_storage gdrive_use_service_account true
          dvc remote modify --local gdrive_storage gdrive_service_account_json_file_path "$credentials_file"

          dvc pull

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q
